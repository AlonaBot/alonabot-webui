# 从已审查 tag 构建组件包，发行正文直接读取 changelog。
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的发行 tag
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: package.json
      - run: npm ci && npm run typecheck && npm run build
      - name: 核对版本并准备打包器
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^version: //p' plugin.yaml)" = "${TAG#v}"
          go mod download github.com/AlonaBot/AlonaBot
          env GOTOOLCHAIN="$(go env GOVERSION)" go -C "$(go list -m -f '{{.Dir}}' github.com/AlonaBot/AlonaBot)" install ./cmd/alonabot
          alonabot check .
      - name: 构建五平台包
        shell: bash
        run: |
          set -euo pipefail
          alonabot pack . --out release-assets \
            --target linux/amd64 --target linux/arm64 --target windows/amd64 \
            --target darwin/amd64 --target darwin/arm64
      - name: 核对许可证
        shell: bash
        run: |
          set -euo pipefail
          for package in release-assets/*.tar.gz; do tar -tzf "$package" | grep -x LICENSE; done
      - name: 生成正文并发布资产
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            for locale in en-US zh-CN; do
              if [ "$locale" = en-US ]; then printf '## English\n\n'; else printf '\n## 简体中文\n\n'; fi
              awk '
                /^ {0,3}(`{3,}|~{3,})/ {
                  marker = $0; sub(/^ */, "", marker)
                  character = substr(marker, 1, 1)
                  sub(character == "`" ? "[^`].*$" : "[^~].*$", "", marker)
                  if (!fence) { fence = character; width = length(marker) }
                  else if (character == fence && length(marker) >= width && $0 ~ ("^ *" fence "+[[:space:]]*$")) { fence = "" }
                  print; next
                }
                !fence && !version && /^#{1,2} / { version = 1; next }
                !fence && /^#{1,6} / { sub(/^#+ /, "### ") }
                { print }
              ' "changelog/${TAG#v}/$locale.md"
            done
          } > "$notes"
          gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$notes" release-assets/*.tar.gz
          gh release edit "$TAG" --draft=false --latest
