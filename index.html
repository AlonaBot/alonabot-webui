<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7FB" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/mark.svg?no-inline" />
    <title>AlonaBot</title>
    <script>
      (function() {
        try {
          var choice = localStorage.getItem('alonabot.webui.theme');
          var isDark = choice === 'dark' || ((!choice || choice === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#0D1422' : '#F4F7FB');
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
